<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIC Search</title><link rel="stylesheet" href="/static/style_vi.css"></head>
<body><header><div class="brand"><b>A</b><span><strong>AIC Search</strong><small>Vietnamese Video Retrieval</small></span></div><div id="ready">Đang nạp mô hình…</div></header>
<main><section class="panel"><h2>System status</h2><div class="stats">
<div><label>Model</label><b id="model">—</b></div><div><label>Device</label><b id="device">—</b></div><div><label>Index</label><b id="index">—</b></div>
<div><label>Videos</label><b id="videos">—</b></div><div><label>Vectors</label><b id="vectors">—</b></div><div><label>Language</label><b id="language">—</b></div></div></section>
<section class="panel"><div class="heading"><div><h2>Truy vấn video</h2><p>Từ khóa ngắn hoặc mô tả tự nhiên dài bằng tiếng Việt.</p></div><kbd>Ctrl + Enter</kbd></div>
<form id="form"><textarea id="query" autofocus required placeholder="Ví dụ: Một người phụ nữ mặc áo đỏ đang cầm micro phát biểu trên sân khấu"></textarea>
<div class="controls"><span>Multilingual CLIP → FAISS → Diversify</span>
<label>Kết quả <select id="top"><option>24</option><option selected>50</option><option>100</option></select></label>
<label>Frame/video <select id="per"><option>1</option><option selected>2</option><option>3</option></select></label><button id="submit">Tìm kiếm</button></div></form>
<div id="notice" class="notice hidden"></div></section>
<section id="result-section" class="hidden"><div class="heading result-head"><div><h2>Kết quả</h2><p id="meta"></p></div><button id="export" class="ghost">Tải CSV đã chọn</button></div><div id="results" class="results"></div></section>
</main><script src="/static/app_vi.js"></script></body></html>
