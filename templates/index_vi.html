<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIC Multimedia Assistant</title><link rel="stylesheet" href="/static/style_vi.css?v=5"></head><body>
<header><div class="brand"><b>A</b><span><strong>AIC Multimedia Assistant</strong><small>KIS · Q&A · TRAKE</small></span></div><div id="ready">Đang nạp mô hình…</div></header>
<main><section class="panel"><h2>System status</h2><div class="stats"><div><label>Model</label><b id="model">—</b></div><div><label>Device</label><b id="device">—</b></div><div><label>Index</label><b id="index">—</b></div><div><label>Videos</label><b id="videos">—</b></div><div><label>Vectors</label><b id="vectors">—</b></div><div><label>Tasks</label><b>KIS · Q&A · TRAKE</b></div></div></section>
<div class="mode-tabs"><button data-mode="manual" class="active">Truy vấn tự do</button><button data-mode="package">Gói sơ tuyển BTC</button></div>
<section id="package-panel" class="panel hidden"><div class="heading"><div><h2>Import gói truy vấn BTC</h2><p>ZIP chứa query-*-kis.txt, query-*-qa.txt và query-*-trake.txt ở thư mục gốc.</p></div><label class="upload">Chọn ZIP<input id="package-file" type="file" accept=".zip,application/zip"></label></div><div id="package-work" class="package-work hidden"><aside><div id="package-summary"></div><div id="query-list" class="query-list"></div></aside><div class="package-actions"><button id="export-package" disabled>Xuất submission.zip</button></div></div><div id="package-notice" class="notice hidden"></div></section>
<div class="workspace"><aside id="package-sidebar" class="hidden"></aside><div class="workspace-main"><section class="panel"><div id="task-tabs" class="task-tabs"><button type="button" data-task="kis" class="active">Textual KIS</button><button type="button" data-task="qa">Visual Q&A</button><button type="button" data-task="trake">TRAKE</button></div><div class="heading"><div><h2 id="task-title">Textual Known Item Search</h2><p id="hint"></p><strong id="active-query" class="active-query hidden"></strong></div><kbd>Ctrl + Enter</kbd></div><form id="form"><textarea id="query" autofocus required></textarea><div class="controls"><label id="quality-wrap">Chế độ <select id="quality"><option value="false">Nhanh</option><option value="true" selected>Chất lượng</option></select></label><label id="top-wrap">Kết quả <select id="top"><option>24</option><option selected>50</option><option>100</option></select></label><label id="per-wrap">Frame/video <select id="per"><option>1</option><option selected>2</option><option>3</option></select></label><button id="submit">Truy xuất</button></div></form><div id="notice" class="notice hidden"></div></section>
<section id="result-section" class="hidden"><div class="heading result-head"><div><h2>Kết quả</h2><p id="meta"></p></div><div class="result-actions"><button id="all" class="ghost">Chọn tất cả</button><button id="answer" class="qa-action hidden">Qwen trả lời ảnh đã chọn</button><button id="save-query" class="package-action hidden">Lưu kết quả query</button><button id="export" class="ghost">Tải CSV đã chọn</button></div></div><div id="results" class="results"></div></section></div></div></main><script src="/static/app_vi.js?v=5"></script></body></html>
