<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIC Multimedia Assistant</title><link rel="stylesheet" href="/static/style_vi.css"></head><body>
<header><div class="brand"><b>A</b><span><strong>AIC Multimedia Assistant</strong><small>KIS · Q&A · TRAKE</small></span></div><div id="ready">Đang nạp mô hình…</div></header>
<main><section class="panel"><h2>System status</h2><div class="stats"><div><label>Model</label><b id="model">—</b></div><div><label>Device</label><b id="device">—</b></div><div><label>Index</label><b id="index">—</b></div><div><label>Videos</label><b id="videos">—</b></div><div><label>Vectors</label><b id="vectors">—</b></div><div><label>Tasks</label><b>KIS · Q&A · TRAKE</b></div></div></section>
<section class="panel"><div class="heading"><div><h2>Truy vấn multimedia</h2><p id="hint">Tìm khoảnh khắc video bằng từ khóa hoặc mô tả tự nhiên.</p></div><kbd>Ctrl + Enter</kbd></div><form id="form"><textarea id="query" autofocus required></textarea><div class="controls"><label>Dạng <select id="task"><option value="kis">Textual KIS</option><option value="qa">Visual Q&A</option><option value="trake">TRAKE</option></select></label><label id="quality-wrap">Chế độ <select id="quality"><option value="false">Nhanh</option><option value="true" selected>Chất lượng</option></select></label><label id="top-wrap">Kết quả <select id="top"><option>24</option><option selected>50</option><option>100</option></select></label><label id="per-wrap">Frame/video <select id="per"><option>1</option><option selected>2</option><option>3</option></select></label><label id="vlm-wrap" class="hidden">Qwen candidates <select id="vlm"><option>3</option><option selected>6</option><option>12</option></select></label><button id="submit">Truy xuất</button></div></form><div id="notice" class="notice hidden"></div></section>
<section id="result-section" class="hidden"><div class="heading result-head"><div><h2>Kết quả</h2><p id="meta"></p></div><div><button id="all" class="ghost">Chọn tất cả</button><button id="export" class="ghost">Tải CSV đã chọn</button></div></div><div id="results" class="results"></div></section></main><script src="/static/app_vi.js"></script></body></html>
